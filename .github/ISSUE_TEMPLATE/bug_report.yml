name: Bug report
description: Report a bug in the boilerplate
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the expected and the actual behavior.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. `npm run dev`
        2. Create an account in the UI
        3. See error in console…
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, Node version and PostgreSQL version.
      placeholder: "Windows 11 / Node 22 / PostgreSQL 17"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshot
      render: shell
