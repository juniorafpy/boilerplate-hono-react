name: Bug report
description: Reporta un error en el boilerplate
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: ¿Qué pasó?
      description: Describe el comportamiento esperado y el real.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. `npm run dev`
        2. Crear cuenta en la UI
        3. Ver error en consola…
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Entorno
      description: SO, versión de Node y de PostgreSQL.
      placeholder: "Windows 11 / Node 22 / PostgreSQL 17"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs o captura
      render: shell
