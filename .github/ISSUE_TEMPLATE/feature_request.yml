name: Feature request
description: Suggest a new feature or improvement for the boilerplate
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to add?
      description: Describe the feature and why it fits the stack (Hono/Drizzle/Better Auth/React).
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Usage example
      placeholder: "As a user I want… so that…"
